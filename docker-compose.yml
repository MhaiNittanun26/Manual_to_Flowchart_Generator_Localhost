services:
  manual-flow-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /workflow-intelligence
    container_name: manual-to-flowchart-app
    restart: always
    ports:
      # เปิดเฉพาะ localhost ให้ nginx บนเครื่องเดียวกัน proxy เข้ามา
      - "127.0.0.1:3040:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
