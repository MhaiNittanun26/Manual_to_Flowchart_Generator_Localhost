# ── Manual-to-Flowchart Generator (vinext มี basePath /workflow-intelligence อยู่แล้ว) ──
# วางบล็อกนี้เพิ่มในไฟล์ server { ... } ของ nginx บนเซิร์ฟเวอร์
# ไม่ใส่ / ท้าย proxy_pass = ส่ง path เดิมทั้งก้อนรวม /workflow-intelligence ไปให้แอป
# 3040 คือพอร์ตที่แอปฟังอยู่บนเครื่อง (ดู docker-compose.yml หรือ PORT ที่ตั้งไว้)
location /workflow-intelligence {
    proxy_pass http://127.0.0.1:3040;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    # ไฟล์คู่มือที่อัปโหลดถูกประมวลผลในเบราว์เซอร์ แต่เผื่อขนาด request ไว้ให้พอ
    client_max_body_size 50m;
}
